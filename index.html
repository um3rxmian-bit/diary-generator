<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework Diary Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Nunito+Sans:wght@400;600&family=JetBrains+Mono:wght@500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--navy:#1F3A68;--tint:#EEF3FA;--line:#D5DEEC;--muted:#5A6B87}
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;font-family:'Nunito Sans',sans-serif;color:#1a1a1a}
.app{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:'Quicksand',sans-serif;font-size:20px;margin:0 0 12px;color:var(--navy)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,textarea{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{resize:vertical;min-height:44px}
.f{margin-bottom:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:15px;padding:12px 16px;border-radius:10px;border:1px solid var(--navy);cursor:pointer;background:#fff;color:var(--navy)}
.pri{background:var(--navy);color:#fff;flex:1}
.sub{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px}
#view{width:100%;overflow:hidden;margin-bottom:14px}
#card{width:540px;height:960px;display:flex;flex-direction:column;transform-origin:top left;background:#fff;color:#1a1a1a}
.n{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:.9em}
.hd{background:var(--navy);color:#fff;height:132px;text-align:center;padding-top:22px}
.hd .t{font-family:'Quicksand',sans-serif;font-weight:700;font-size:34px;line-height:1.1}
.hd .c{font-size:14px;color:#C9D5EA;margin-top:5px}
.hd .p{display:inline-block;font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;border:1px solid #8EA3C8;border-radius:14px;padding:4px 14px;margin-top:10px}
.stripe{display:flex;height:5px}
.stripe i{flex:1}
.bub{height:64px;display:flex;gap:10px;align-items:center;padding:0 18px}
.bubble{background:var(--tint);border:1px solid var(--line);border-radius:30px;padding:6px 16px;display:flex;flex-direction:column;justify-content:center;height:46px}
.bubble b{font-family:'Quicksand',sans-serif;font-weight:700;font-size:11px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;line-height:1.1}
.bubble span{font-size:18px;font-weight:600;line-height:1.2;color:var(--navy)}
.rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,1fr);gap:6px;padding:0 18px}
.r,.an{border:1.5px solid var(--c);border-radius:10px;overflow:hidden;display:flex;min-height:0;background:#fff}
.sn{width:150px;flex-shrink:0;background:var(--cb);color:var(--c);font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;line-height:1.25;padding:6px 10px;display:flex;align-items:center;border-right:1.5px solid var(--c)}
.bd{flex:1;min-width:0;min-height:0;overflow:hidden;padding:4px 12px;font-size:15px;line-height:1.35;display:flex;align-items:center}
.in{width:100%}
.e{color:#a3abb8}
.ur{direction:rtl;text-align:right;font-family:'Noto Nastaliq Urdu',serif;line-height:1.9;font-size:.92em}
.an{margin:6px 18px 0;height:104px;flex-direction:column}
.ah{background:var(--cb);color:var(--c);font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;padding:5px 12px;border-bottom:1.5px solid var(--c)}
.ft{height:66px;display:flex;gap:10px;align-items:center;padding:0 18px;margin-top:6px}
.ft div{flex:1;background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:6px 12px;line-height:1.3}
.ft small{display:block;font-family:'Quicksand',sans-serif;font-weight:700;font-size:10px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.ft b{display:block;font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;color:var(--navy)}
.ft span{font-size:12px}
#out{width:100%;border-radius:8px;display:none;margin-top:8px}
.note{font-size:13px;color:var(--muted)}
body{background:linear-gradient(180deg,#E6EDF8 0,#F6F8FB 260px);padding-bottom:100px}
.app{padding:22px 16px}
.top{margin-bottom:16px}
.top h1{font-size:25px;margin:0}
.top p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.panel{border-radius:16px;padding:16px;border:1px solid #E3E9F3;box-shadow:0 1px 2px rgba(31,58,104,.06),0 8px 24px rgba(31,58,104,.07)}
.st{font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:2px 0 10px}
input,textarea{border-radius:10px;background:#FAFBFD;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,58,104,.12);background:#fff}
.sub{padding-left:8px;line-height:1.1;margin-bottom:6px;color:#33415c}
button{border-radius:12px;transition:transform .1s}
button:active{transform:scale(.97)}
.pri{box-shadow:0 2px 6px rgba(31,58,104,.25)}
.btns{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:10;flex-wrap:nowrap}
#view{border-radius:14px;box-shadow:0 10px 30px rgba(31,58,104,.16)}
#card{background:#F7F9FC}
.n{font-size:.8em}
.hd{position:relative;overflow:hidden}
.hd>*{position:relative}
.hd:before,.hd:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hd:before{width:170px;height:170px;left:-50px;top:-70px}
.hd:after{width:130px;height:130px;right:-30px;bottom:-60px}
.ft{height:80px;background:var(--navy);margin-top:8px}
.ft .ct{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 10px}
.ft .ic{width:30px;height:30px;border-radius:50%;background:#F4C15D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ft .tx{display:block;min-width:0}
.ft small{color:#C9D5EA}
.ft b{color:#fff}
.ft .n{color:#fff;font-size:11px}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>Homework Diary Generator</h1><p>Type the homework, check the preview, then download or share.</p></div>
<div class="panel">
 <div class="st">Class and date</div><div class="row2">
  <div class="f"><label for="cls">Class</label><input id="cls" placeholder="9th" dir="auto"></div>
  <div class="f"><label for="date">Date</label><input id="date" type="date"></div>
 </div>
 <div class="st" style="margin-top:6px">Homework</div><div id="fields"></div>
 <div class="btns"><button id="clr">Clear</button><button id="dl" class="pri">Download image</button><button id="sh" class="pri">Share</button></div>
</div>
<div class="st" style="margin:0 2px 8px">Preview</div><div id="view"><div id="card"></div></div>
<div class="panel" id="outbox" style="display:none">
 <div class="note">If the download did not start, press and hold the image below and choose Save.</div>
 <img id="out" alt="Homework diary image">
</div>
</div>
<script>
var SCHOOL={name:'The Cambridge School System',campus:'Ibrahim Campus, Khiali, Gujranwala',
 principal:{name:"Ma'am Tahira Yasmeen",tel:'+92 331 4624959'},
 admin:{name:'Sir Umer',tel:'+92 304 8155677'}};
var SUBJ=[
['English','#D85A30','Pg 90, Q1 A 1, 2, 3.\nEx comp. Test (W)'],
['Urdu','#1D9E75','Pg 131 B.R + L'],
['Mathematics','#B8860B',''],
['General Science / Chemistry','#7A4FB0',''],
['Computer Science / Biology','#639922',''],
['Geography / Physics','#2F7FB5',''],
['Islamiyat','#0E7C86','Pg 32, Q1 A 1, 2, 3.\nEx comp. CW is L'],
['Translation of Holy Quran','#8A6D1F','']];
var AN=['Important Announcements','#B45309'];
var ICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F3A68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
function ct(l,n,t){return '<div class="ct"><i class="ic">'+ICON+'</i><span class="tx"><small>'+l+'</small><b>'+n+'</b><span class="n">'+t+'</span></span></div>'}
var KEY='diary-v3',$=function(i){return document.getElementById(i)};
var fields=$('fields'),card=$('card'),view=$('view'),CM=SUBJ.length;
SUBJ.concat([AN]).forEach(function(s,i){
 var d=document.createElement('div');d.className='f';
 d.innerHTML='<label for="s'+i+'" class="sub" style="border-left:4px solid '+s[1]+'">'+s[0]+'</label><textarea id="s'+i+'" dir="auto" rows="'+(i==CM?3:1)+'"></textarea>';
 fields.appendChild(d);
});
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function num(t){return esc(t).replace(/\d[\d.\-\/:]*\d|\d/g,'<span class="n">$&</span>')}
function line(t){
 if(/[\u0600-\u06FF]/.test(t))return '<div class="ur">'+esc(t)+'</div>';
 return '<div>'+num(t)+'</div>';
}
function body(v,empty){
 v=v.trim();
 if(!v)return '<div class="e">'+empty+'</div>';
 return v.split('\n').filter(Boolean).map(line).join('');
}
function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function getDate(){
 var v=$('date').value;if(!v)return new Date();
 var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]);
}
function render(){
 var d=getDate(),day=d.toLocaleDateString('en-US',{weekday:'long'});
 var ds=d.getDate()+'-'+(d.getMonth()+1)+'-'+String(d.getFullYear()).slice(2);
 var cls=$('cls').value.trim();
 var rows=SUBJ.map(function(s,i){
  return '<div class="r" style="--c:'+s[1]+';--cb:'+rgba(s[1],.12)+'"><div class="sn">'+s[0]+'</div><div class="bd"><div class="in">'+body($('s'+i).value,'No homework')+'</div></div></div>';
 }).join('');
 var stripe=SUBJ.map(function(s){return '<i style="background:'+s[1]+'"></i>'}).join('');
 card.innerHTML=
 '<div class="hd"><div class="t">'+SCHOOL.name+'</div><div class="c">'+SCHOOL.campus+'</div><div class="p">DAILY HOMEWORK DIARY</div></div>'+
 '<div class="stripe">'+stripe+'</div>'+
 '<div class="bub"><div class="bubble" style="flex:1.3;background:#EEF3FA;border-color:#C5D3EA"><b>Day</b><span>'+day+'</span></div>'+
 '<div class="bubble" style="flex:.8;background:#FFF4DC;border-color:#F0D9A0"><b>Class</b><span>'+(cls?num(cls):'-')+'</span></div>'+
 '<div class="bubble" style="flex:1.1;background:#E3F5EC;border-color:#B5E0CB"><b>Date</b><span class="n">'+ds+'</span></div></div>'+
 '<div class="rows">'+rows+'</div>'+
 '<div class="an" style="--c:'+AN[1]+';--cb:'+rgba(AN[1],.12)+'"><div class="ah">'+AN[0]+'</div><div class="bd"><div class="in">'+body($('s'+CM).value,'No announcements today')+'</div></div></div>'+
 '<div class="ft">'+ct('Principal',SCHOOL.principal.name,SCHOOL.principal.tel)+
 ct('Group admin',SCHOOL.admin.name,SCHOOL.admin.tel)+'</div><div class="stripe">'+stripe+'</div>';
 shrink();fit();
}
function shrink(){
 var bs=card.querySelectorAll('.bd');
 for(var i=0;i<bs.length;i++){
  var el=bs[i],inn=el.firstChild,fs=15;el.style.fontSize=fs+'px';
  while(inn.offsetHeight>el.clientHeight-8&&fs>9){fs--;el.style.fontSize=fs+'px'}
 }
}
function fit(){
 var s=Math.min(1,view.clientWidth/540);
 card.style.transform='scale('+s+')';
 view.style.height=(960*s)+'px';
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify({cls:$('cls').value,v:SUBJ.concat([AN]).map(function(s,i){return $('s'+i).value})}))}catch(e){}
}
function load(){
 var o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 var t=new Date();
 $('date').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
 if(o){$('cls').value=o.cls||'';o.v.forEach(function(x,i){if($('s'+i))$('s'+i).value=x})}
 else SUBJ.forEach(function(s,i){$('s'+i).value=s[2]});
}
function fname(){return 'diary-'+($('cls').value.replace(/\s+/g,'')||'class')+'-'+getDate().toISOString().slice(0,10)+'.png'}
function make(){
 var old=card.style.transform;card.style.transform='none';view.style.height='auto';
 function back(){card.style.transform=old;fit()}
 return (document.fonts?document.fonts.ready:Promise.resolve()).then(function(){
  shrink();
  return html2canvas(card,{scale:2,backgroundColor:'#ffffff',useCORS:true});
 }).then(function(cv){
  back();
  return new Promise(function(res){cv.toBlob(res,'image/png')});
 }).catch(function(e){back();throw e});
}
function fail(b,t){b.textContent=t;alert('Could not make the image. Check your internet connection and try again.')}
function save2(bl){
 var u=URL.createObjectURL(bl),a=document.createElement('a');
 a.href=u;a.download=fname();document.body.appendChild(a);a.click();a.remove();
 $('out').src=u;$('out').style.display='block';$('outbox').style.display='block';
}
document.addEventListener('input',function(){save();render()});
$('clr').onclick=function(){for(var i=0;i<=CM;i++)$('s'+i).value='';save();render()};
window.addEventListener('resize',fit);
$('dl').onclick=function(){
 var b=$('dl');b.textContent='Making image...';
 make().then(function(bl){save2(bl);b.textContent='Download image'}).catch(function(){fail(b,'Download image')});
};
$('sh').onclick=function(){
 var b=$('sh');b.textContent='Making image...';
 make().then(function(bl){
  b.textContent='Share';
  var f=new File([bl],fname(),{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   return navigator.share({files:[f]}).catch(function(e){if(e&&e.name!=='AbortError')save2(bl)});
  }
  save2(bl);
 }).catch(function(){fail(b,'Share')});
};
load();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
</script>
</body>
</html>
